name: Build Signal Lost APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate room artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/drawable-nodpi/signal_lost_room.jpg')
          image = p.read_bytes()
          if not image.startswith(b'\xff\xd8') or not image.endswith(b'\xff\xd9'):
              raise SystemExit(f'Artwork JPEG is incomplete: {len(image)} bytes')
          print(f'Validated complete JPEG: {len(image)} bytes')
          PY
          file app/src/main/res/drawable-nodpi/signal_lost_room.jpg

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-lost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
